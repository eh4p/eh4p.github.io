<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Ehab Muhammad — Software Engineer and Backend Engineer portfolio."
  />
  <title>Ehab Muhammad — Backend Engineer</title>

  <style>
    /*
      =========================================================
      LOCAL FONT SETUP
      =========================================================

      Your current local font files from the screenshots:

      League Spartan:
      ./public/fonts/LeagueSpartan/LeagueSpartan-Black.ttf

      Inter 18pt:
      ./public/fonts/inter/Inter_18pt-Regular.ttf
      ./public/fonts/inter/Inter_18pt-Medium.ttf
      ./public/fonts/inter/Inter_18pt-SemiBold.ttf

      Inter 24pt:
      ./public/fonts/inter/Inter_24pt-Regular.ttf
      ./public/fonts/inter/Inter_24pt-Medium.ttf
      ./public/fonts/inter/Inter_24pt-SemiBold.ttf

      Inter 28pt:
      ./public/fonts/inter/Inter_28pt-Regular.ttf
      ./public/fonts/inter/Inter_28pt-Medium.ttf
      ./public/fonts/inter/Inter_28pt-SemiBold.ttf

      If your HTML file is NOT beside the public folder, edit these paths.
      If you use a framework that maps public/ to the site root, change
      "./public/fonts/..." to "/fonts/...".
    */

    @font-face {
      font-family: "League Spartan Local";
      src: url("./public/fonts/LeagueSpartan/LeagueSpartan-Black.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 18pt Local";
      src: url("./public/fonts/inter/Inter_18pt-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 18pt Local";
      src: url("./public/fonts/inter/Inter_18pt-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 18pt Local";
      src: url("./public/fonts/inter/Inter_18pt-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 24pt Local";
      src: url("./public/fonts/inter/Inter_24pt-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 24pt Local";
      src: url("./public/fonts/inter/Inter_24pt-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 24pt Local";
      src: url("./public/fonts/inter/Inter_24pt-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 28pt Local";
      src: url("./public/fonts/inter/Inter_28pt-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 28pt Local";
      src: url("./public/fonts/inter/Inter_28pt-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter 28pt Local";
      src: url("./public/fonts/inter/Inter_28pt-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --color-primary: #9FE870;
      --color-background: #163300;
      --color-content: #E8EBE6;

      --color-surface: rgba(232, 235, 230, 0.08);
      --color-surface-strong: rgba(232, 235, 230, 0.14);
      --color-surface-soft: rgba(232, 235, 230, 0.045);
      --color-border: rgba(232, 235, 230, 0.18);
      --color-border-strong: rgba(159, 232, 112, 0.42);
      --color-muted: rgba(232, 235, 230, 0.72);
      --color-muted-soft: rgba(232, 235, 230, 0.52);
      --color-primary-dark: #163300;
      --color-shadow: rgba(0, 0, 0, 0.28);

      --font-display: "League Spartan Local", "Arial Black", Impact, sans-serif;
      --font-inter-18: "Inter 18pt Local", Inter, Arial, sans-serif;
      --font-inter-24: "Inter 24pt Local", Inter, Arial, sans-serif;
      --font-inter-28: "Inter 28pt Local", Inter, Arial, sans-serif;

      --radius-small: 16px;
      --radius-medium: 20px;
      --radius-large: 30px;
      --radius-x-large: 40px;
      --radius-2x-large: 60px;

      --container-width: 860px;
      --space-page: clamp(18px, 4vw, 44px);
      --transition: 180ms ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--color-content);
      background:
        radial-gradient(circle at 50% -10%, rgba(159, 232, 112, 0.20), transparent 32rem),
        radial-gradient(circle at 14% 22%, rgba(159, 232, 112, 0.12), transparent 23rem),
        radial-gradient(circle at 90% 60%, rgba(232, 235, 230, 0.07), transparent 28rem),
        var(--color-background);
      font-family: var(--font-inter-18);
      font-size: 16px;
      line-height: 24px;
      letter-spacing: -0.005em;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        linear-gradient(rgba(232, 235, 230, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 235, 230, 0.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
    }

    a {
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 4px;
      border-radius: 14px;
    }

    ::selection {
      color: var(--color-primary-dark);
      background: var(--color-primary);
    }

    .page-shell {
      width: min(100%, calc(var(--container-width) + (var(--space-page) * 2)));
      margin: 0 auto;
      padding: 28px var(--space-page) 48px;
    }

    .skip-link {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 50;
      transform: translateY(-150%);
      border-radius: 999px;
      background: var(--color-primary);
      color: var(--color-primary-dark);
      padding: 12px 18px;
      font-family: var(--font-inter-18);
      font-weight: 600;
      text-decoration: none;
      transition: transform var(--transition);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-nav {
      position: sticky;
      top: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      margin-bottom: 72px;
      padding: 10px 10px 10px 16px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: rgba(22, 51, 0, 0.72);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--color-content);
      text-decoration: none;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-primary-dark);
      font-family: var(--font-display);
      font-size: 18px;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .brand-text {
      overflow: hidden;
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      letter-spacing: 0.0125em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-link {
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: 0.0125em;
      text-decoration: none;
      transition:
        color var(--transition),
        background var(--transition);
    }

    .nav-link:hover {
      color: var(--color-content);
      background: var(--color-surface);
    }

    main {
      display: grid;
      gap: 22px;
    }

    .section,
    .hero {
      opacity: 0;
      animation: fadeUp 640ms ease forwards;
      animation-delay: var(--delay, 0ms);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 54px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2x-large);
      background:
        linear-gradient(135deg, rgba(232, 235, 230, 0.13), rgba(232, 235, 230, 0.055)),
        rgba(232, 235, 230, 0.07);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.25);
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -110px;
      right: -90px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: var(--color-primary);
      opacity: 0.92;
      filter: blur(0);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: 34px;
      bottom: 32px;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(159, 232, 112, 0.45);
      border-radius: 44px;
      transform: rotate(10deg);
      opacity: 0.7;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--color-border-strong);
      border-radius: 999px;
      background: rgba(159, 232, 112, 0.10);
      color: var(--color-primary);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
      box-shadow: 0 0 0 6px rgba(159, 232, 112, 0.13);
    }

    .hero-title {
      max-width: 720px;
      margin: 0;
      color: var(--color-content);
      font-family: var(--font-display);
      font-size: clamp(62px, 13vw, 132px);
      font-weight: 900;
      line-height: 0.78;
      letter-spacing: 0.012em;
      text-transform: uppercase;
    }

    .hero-title span {
      color: var(--color-primary);
    }

    .hero-subtitle {
      max-width: 690px;
      margin: 0;
      font-family: var(--font-inter-28);
      font-size: clamp(24px, 4vw, 30px);
      font-weight: 600;
      line-height: 34px;
      letter-spacing: -0.025em;
    }

    .hero-summary {
      max-width: 690px;
      margin: 0;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.005em;
    }

    .hero-actions,
    .contact-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
      letter-spacing: 0.005em;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform var(--transition),
        background var(--transition),
        color var(--transition),
        border-color var(--transition);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--color-primary);
      color: var(--color-primary-dark);
    }

    .button-primary:hover {
      background: #b7f18e;
    }

    .button-secondary {
      border-color: var(--color-border);
      background: rgba(232, 235, 230, 0.06);
      color: var(--color-content);
    }

    .button-secondary:hover {
      border-color: var(--color-border-strong);
      background: rgba(159, 232, 112, 0.12);
    }

    .section {
      padding: clamp(24px, 4vw, 32px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-large);
      background: var(--color-surface);
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition);
    }

    .section:hover {
      transform: translateY(-2px);
      border-color: rgba(232, 235, 230, 0.26);
      background: rgba(232, 235, 230, 0.105);
    }

    .section-header {
      display: grid;
      gap: 10px;
      margin-bottom: 24px;
    }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--color-primary);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .section-kicker::after {
      content: "";
      display: inline-block;
      width: 42px;
      height: 2px;
      border-radius: 999px;
      background: var(--color-primary);
    }

    .section-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .section-description {
      max-width: 650px;
      margin: 0;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.005em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card {
      min-height: 136px;
      padding: 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-large);
      background: rgba(232, 235, 230, 0.06);
    }

    .stat-value {
      margin: 0 0 14px;
      color: var(--color-primary);
      font-family: var(--font-display);
      font-size: clamp(40px, 7vw, 64px);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .stat-label {
      margin: 0;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
      letter-spacing: 0.01em;
    }

    .summary-card {
      padding: 26px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-large);
      background: rgba(232, 235, 230, 0.055);
    }

    .summary-card p {
      margin: 0;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.005em;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 14px;
    }

    .timeline-item {
      position: relative;
      padding: 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-large);
      background: rgba(232, 235, 230, 0.055);
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition);
    }

    .timeline-item:hover {
      transform: translateY(-2px);
      border-color: var(--color-border-strong);
      background: rgba(232, 235, 230, 0.09);
    }

    .timeline-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .timeline-role {
      margin: 0;
      font-family: var(--font-inter-24);
      font-size: 22px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: -0.015em;
    }

    .timeline-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
      letter-spacing: 0.01em;
    }

    .timeline-period {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--color-primary);
      color: var(--color-primary-dark);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: 0.0125em;
      white-space: nowrap;
    }

    .bullet-list {
      display: grid;
      gap: 10px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .bullet-list li {
      position: relative;
      padding-left: 22px;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.005em;
    }

    .bullet-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.65em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .skill-groups {
      display: grid;
      gap: 16px;
    }

    .skill-group {
      padding: 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-large);
      background: rgba(232, 235, 230, 0.052);
    }

    .skill-group-title {
      margin: 0 0 14px;
      color: var(--color-primary);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: rgba(232, 235, 230, 0.052);
      color: var(--color-content);
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: 0.0125em;
      transition:
        background var(--transition),
        color var(--transition),
        border-color var(--transition),
        transform var(--transition);
    }

    .chip:hover {
      transform: translateY(-1px);
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: var(--color-primary-dark);
    }

    .education-list,
    .project-list,
    .simple-list {
      display: grid;
      gap: 12px;
    }

    .mini-card,
    .project-card {
      padding: 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-large);
      background: rgba(232, 235, 230, 0.052);
    }

    .mini-card h3,
    .project-card h3 {
      margin: 0 0 8px;
      font-family: var(--font-inter-24);
      font-size: 22px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: -0.015em;
    }

    .mini-card p,
    .project-card p {
      margin: 0;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.005em;
    }

    .project-card {
      display: grid;
      gap: 16px;
    }

    .project-card .button {
      width: fit-content;
    }

    .simple-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .simple-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px 18px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-medium);
      background: rgba(232, 235, 230, 0.052);
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.005em;
    }

    .simple-list li::before {
      content: "";
      width: 10px;
      height: 10px;
      margin-top: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .contact-panel {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 18px;
      padding: clamp(28px, 6vw, 44px);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-x-large);
      background:
        linear-gradient(135deg, rgba(159, 232, 112, 0.18), rgba(232, 235, 230, 0.06)),
        rgba(232, 235, 230, 0.08);
    }

    .contact-panel::after {
      content: "";
      position: absolute;
      right: -54px;
      bottom: -54px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: var(--color-primary);
      opacity: 0.92;
    }

    .contact-panel > * {
      position: relative;
      z-index: 1;
    }

    .contact-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .contact-text {
      max-width: 630px;
      margin: 0;
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.005em;
    }

    .footer {
      padding: 28px 0 0;
      color: var(--color-muted-soft);
      text-align: center;
      font-family: var(--font-inter-18);
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
      letter-spacing: 0.01em;
    }

    .footer a {
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .empty-state {
      padding: 22px;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-large);
      color: var(--color-muted);
      font-family: var(--font-inter-18);
      font-size: 16px;
      line-height: 24px;
    }

    @media (max-width: 820px) {
      .site-nav {
        align-items: flex-start;
        border-radius: 28px;
      }

      .nav-links {
        display: none;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .timeline-top {
        flex-direction: column;
      }

      .timeline-period {
        white-space: normal;
      }
    }

    @media (max-width: 540px) {
      .page-shell {
        padding-top: 18px;
      }

      .site-nav {
        margin-bottom: 38px;
      }

      .hero {
        border-radius: 38px;
      }

      .hero::before {
        width: 210px;
        height: 210px;
        top: -120px;
        right: -120px;
      }

      .hero::after {
        display: none;
      }

      .hero-title {
        font-size: clamp(54px, 18vw, 82px);
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 22px;
      }

      .timeline-item,
      .skill-group,
      .mini-card,
      .project-card {
        padding: 18px;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .hero,
      .section {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app"></div>

  <script>
    const portfolioData = {
      name: "Ehab Muhammad",
      role: "Software Engineer | Backend Engineer",
      location: "Cairo, Egypt",
      email: "em.ehabm@gmail.com",
      phone: "01508291561",
      links: {
        linkedin: "https://linkedin.com/in/ehab-m",
        github: "https://github.com/eh4p",
        portfolio: "https://eh4p.github.io"
      },
      hero: {
        eyebrow: "Software Engineer · Backend Engineer",
        displayTitle: "Backend Engineer",
        screenTitle: "I build scalable backend systems for real products.",
        summary:
          "Software Engineer with a strong focus on computer science and hands-on experience with modern backend technologies. Skilled in backend development, software architecture, cloud tooling, and modern frameworks, with experience delivering scalable products and systems serving real users in production."
      },
      stats: [
        {
          value: "30+",
          label: "Active beta users supported"
        },
        {
          value: "50+",
          label: "Business owners supported"
        },
        {
          value: "5+",
          label: "Third-party integrations"
        },
        {
          value: "3+",
          label: "End-to-end projects"
        }
      ],
      experience: [
        {
          title: "Software Engineer",
          company: "Alquileres360",
          type: "Freelance",
          location: "Spain",
          period: "Aug 2025 – Present",
          bullets: [
            "Developed and maintained the Alquileres360 property management platform, enabling owners, tenants, and professionals to streamline rental operations for 30+ active users in beta.",
            "Built backend services using Node.js from scratch to meet business requirements, following scalable architecture and industry-standard patterns.",
            "Reduced code coupling, improved maintainability, implemented real-time features, and significantly improved performance."
          ]
        },
        {
          title: "Full-Stack Developer",
          company: "QwickSite",
          type: "",
          location: "",
          period: "Jan 2025 – Present",
          bullets: [
            "Contributed to QwickSite, a no-code website builder SaaS platform enabling 50+ business owners to create professional websites with e-commerce capabilities and other business domains.",
            "Developed backend APIs using Node.js and frontend features using Angular and Next.js.",
            "Supported 5+ integrated third-party services, including shipment providers and Google services.",
            "Explored how large-scale systems and projects work and interact with each other."
          ]
        },
        {
          title: "Software Engineering Trainee",
          company: "Information Technology Institute",
          type: "ITI",
          location: "",
          period: "May 2024 – Oct 2024",
          bullets: [
            "Completed a 6-month intensive software engineering training program sponsored by the Ministry of Communication and Information Technology.",
            "Covered full-stack development fundamentals and built 3+ end-to-end projects.",
            "Gained practical exposure to a strong learning environment and developed a deeper understanding of software engineering principles."
          ]
        }
      ],
      education: [
        {
          degree: "Premaster in Computer Science",
          institution: "Cairo University, Graduate Studies for Statistical Research",
          details: "FGSSR"
        },
        {
          degree: "Software Engineering Diploma",
          institution: "Information Technology Institute",
          details: "Ministry of Communication and Information Technology"
        },
        {
          degree: "Bachelor of Commerce and Business Administration",
          institution: "Helwan University",
          details: "Accounting Department, English Section"
        }
      ],
      projects: [
        {
          name: "Personal Projects",
          description:
            "Additional personal projects are available on GitHub, demonstrating backend technologies, software architecture patterns, and engineering practices.",
          link: "https://github.com/eh4p"
        }
      ],
      skills: [
        {
          group: "Languages & Frameworks",
          items: ["ASP.NET Core", "C#"]
        },
        {
          group: "Data & Caching",
          items: ["MS SQL Server", "Entity Framework Core", "LINQ", "ADO.NET", "Redis"]
        },
        {
          group: "Architecture & Design",
          items: [
            "Clean Architecture",
            "N-Tier",
            "Onion Architecture",
            "OOP",
            "SOLID",
            "Repository Pattern",
            "Unit of Work",
            "CQRS",
            "MediatR"
          ]
        },
        {
          group: "DevOps & Tooling",
          items: ["Git", "GitHub", "Docker", "CI/CD", "Azure DevOps"]
        },
        {
          group: "Security & Auth",
          items: ["JWT", "OAuth", "Identity"]
        },
        {
          group: "Real-Time Communication",
          items: ["SignalR"]
        },
        {
          group: "Practices & Methodologies",
          items: ["Unit Testing", "Agile", "Serilog", "Documentation"]
        },
        {
          group: "Familiar With",
          items: ["Microservices", "Kubernetes", "RabbitMQ", "Kafka"]
        },
        {
          group: "Additional",
          items: ["Angular", "TypeScript"]
        }
      ],
      softSkills: [
        "Strong problem solving and critical thinking abilities",
        "Effective communication and collaboration in team environments",
        "Adaptable and quick to learn new technologies"
      ],
      languages: ["Arabic — Native", "English — Professional"]
    };

    const app = document.querySelector("#app");

    const escapeHtml = (value) =>
      String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    const hasItems = (value) => Array.isArray(value) && value.length > 0;

    const externalLinkAttrs = 'target="_blank" rel="noopener noreferrer"';

    const makeButton = ({ href, label, type = "secondary", ariaLabel }) => {
      if (!href || !label) return "";

      const finalHref = href.startsWith("mailto:")
        ? href
        : href.startsWith("tel:")
          ? href
          : href;

      const attrs = finalHref.startsWith("http") ? externalLinkAttrs : "";
      const safeAria = ariaLabel ? `aria-label="${escapeHtml(ariaLabel)}"` : "";

      return `
        <a class="button button-${type}" href="${escapeHtml(finalHref)}" ${attrs} ${safeAria}>
          ${escapeHtml(label)}
        </a>
      `;
    };

    const sectionHeader = ({ kicker, title, description }) => {
      if (!title) return "";

      return `
        <div class="section-header">
          ${kicker ? `<span class="section-kicker">${escapeHtml(kicker)}</span>` : ""}
          <h2 class="section-title">${escapeHtml(title)}</h2>
          ${description ? `<p class="section-description">${escapeHtml(description)}</p>` : ""}
        </div>
      `;
    };

    const renderNavigation = (data) => {
      const navItems = [
        { label: "Experience", href: "#experience" },
        { label: "Skills", href: "#skills" },
        { label: "Projects", href: "#projects" },
        { label: "Contact", href: "#contact" }
      ];

      return `
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#" class="brand-mark" aria-label="${escapeHtml(data.name)} homepage">
            <span class="brand-icon" aria-hidden="true">E</span>
            <span class="brand-text">${escapeHtml(data.name)}</span>
          </a>

          <div class="nav-links">
            ${navItems
              .map(
                (item) => `
                  <a class="nav-link" href="${escapeHtml(item.href)}">
                    ${escapeHtml(item.label)}
                  </a>
                `
              )
              .join("")}
          </div>
        </nav>
      `;
    };

    const renderHero = (data) => {
      if (!data?.hero) return "";

      const titleParts = data.hero.displayTitle.split(" ");
      const firstPart = titleParts.slice(0, -1).join(" ");
      const lastPart = titleParts.at(-1) ?? data.hero.displayTitle;

      return `
        <header class="hero" style="--delay: 60ms;">
          <div class="hero-content">
            ${data.hero.eyebrow ? `<span class="eyebrow">${escapeHtml(data.hero.eyebrow)}</span>` : ""}

            <h1 class="hero-title">
              ${escapeHtml(firstPart || data.hero.displayTitle)}
              ${firstPart ? `<span>${escapeHtml(lastPart)}</span>` : ""}
            </h1>

            ${data.hero.screenTitle ? `<p class="hero-subtitle">${escapeHtml(data.hero.screenTitle)}</p>` : ""}
            ${data.hero.summary ? `<p class="hero-summary">${escapeHtml(data.hero.summary)}</p>` : ""}

            <div class="hero-actions" aria-label="Contact and profile links">
              ${makeButton({
                href: `mailto:${data.email}`,
                label: "Email me",
                type: "primary",
                ariaLabel: `Email ${data.name}`
              })}
              ${makeButton({
                href: data.links?.github,
                label: "GitHub",
                ariaLabel: `${data.name} on GitHub`
              })}
              ${makeButton({
                href: data.links?.linkedin,
                label: "LinkedIn",
                ariaLabel: `${data.name} on LinkedIn`
              })}
              ${makeButton({
                href: data.links?.portfolio,
                label: "Portfolio",
                ariaLabel: `${data.name} portfolio website`
              })}
            </div>
          </div>
        </header>
      `;
    };

    const renderStats = (stats) => {
      if (!hasItems(stats)) return "";

      return `
        <section class="section" aria-labelledby="stats-title" style="--delay: 120ms;">
          ${sectionHeader({
            kicker: "Snapshot",
            title: "Impact in numbers",
            description: "A quick view of shipped work, users supported, integrations, and practical project experience."
          })}
          <div class="stats-grid">
            ${stats
              .filter((stat) => stat?.value && stat?.label)
              .map(
                (stat) => `
                  <article class="stat-card">
                    <p class="stat-value">${escapeHtml(stat.value)}</p>
                    <p class="stat-label">${escapeHtml(stat.label)}</p>
                  </article>
                `
              )
              .join("")}
          </div>
        </section>
      `;
    };

    const renderSummary = (data) => {
      const summary = data?.hero?.summary;
      if (!summary) return "";

      return `
        <section class="section" aria-labelledby="about-title" style="--delay: 180ms;">
          ${sectionHeader({
            kicker: "About",
            title: "Backend-focused engineer",
            description: "Focused on systems that are maintainable, scalable, and useful for real users."
          })}
          <div class="summary-card">
            <p>${escapeHtml(summary)}</p>
          </div>
        </section>
      `;
    };

    const renderExperience = (experience) => {
      if (!hasItems(experience)) return "";

      return `
        <section class="section" id="experience" aria-labelledby="experience-title" style="--delay: 240ms;">
          ${sectionHeader({
            kicker: "Experience",
            title: "Work that shipped",
            description: "Production-facing work across backend services, SaaS platforms, real-time features, and full-stack product delivery."
          })}

          <div class="timeline">
            ${experience
              .filter((item) => item?.title && item?.company)
              .map((item) => {
                const meta = [item.company, item.type, item.location].filter(Boolean);

                return `
                  <article class="timeline-item">
                    <div class="timeline-top">
                      <div>
                        <h3 class="timeline-role">${escapeHtml(item.title)}</h3>
                        ${
                          meta.length
                            ? `<div class="timeline-meta">
                                ${meta.map((value) => `<span class="meta-pill">${escapeHtml(value)}</span>`).join("")}
                              </div>`
                            : ""
                        }
                      </div>

                      ${item.period ? `<span class="timeline-period">${escapeHtml(item.period)}</span>` : ""}
                    </div>

                    ${
                      hasItems(item.bullets)
                        ? `<ul class="bullet-list">
                            ${item.bullets.map((bullet) => `<li>${escapeHtml(bullet)}</li>`).join("")}
                          </ul>`
                        : ""
                    }
                  </article>
                `;
              })
              .join("")}
          </div>
        </section>
      `;
    };

    const renderSkills = (skills) => {
      if (!hasItems(skills)) return "";

      const validGroups = skills.filter((group) => group?.group && hasItems(group.items));
      if (!validGroups.length) return "";

      return `
        <section class="section" id="skills" aria-labelledby="skills-title" style="--delay: 300ms;">
          ${sectionHeader({
            kicker: "Skills",
            title: "Engineering toolkit",
            description: "Backend, data, architecture, DevOps, security, real-time communication, and delivery practices."
          })}

          <div class="skill-groups">
            ${validGroups
              .map(
                (group) => `
                  <article class="skill-group">
                    <h3 class="skill-group-title">${escapeHtml(group.group)}</h3>
                    <div class="chips" aria-label="${escapeHtml(group.group)} skills">
                      ${group.items.map((item) => `<span class="chip">${escapeHtml(item)}</span>`).join("")}
                    </div>
                  </article>
                `
              )
              .join("")}
          </div>
        </section>
      `;
    };

    const renderEducation = (education) => {
      if (!hasItems(education)) return "";

      return `
        <section class="section" aria-labelledby="education-title" style="--delay: 360ms;">
          ${sectionHeader({
            kicker: "Education",
            title: "Academic path",
            description: "Computer science, software engineering training, and business background."
          })}

          <div class="education-list">
            ${education
              .filter((item) => item?.degree && item?.institution)
              .map(
                (item) => `
                  <article class="mini-card">
                    <h3>${escapeHtml(item.degree)}</h3>
                    <p>
                      ${escapeHtml(item.institution)}
                      ${item.details ? ` · ${escapeHtml(item.details)}` : ""}
                    </p>
                  </article>
                `
              )
              .join("")}
          </div>
        </section>
      `;
    };

    const renderProjects = (projects, links) => {
      if (!hasItems(projects)) {
        if (!links?.github) return "";

        return `
          <section class="section" id="projects" aria-labelledby="projects-title" style="--delay: 420ms;">
            ${sectionHeader({
              kicker: "Projects",
              title: "Code and experiments",
              description: "Project details are being prepared. You can still explore the code and experiments on GitHub."
            })}
            <div class="empty-state">
              ${makeButton({
                href: links.github,
                label: "View GitHub",
                type: "primary",
                ariaLabel: "View GitHub profile"
              })}
            </div>
          </section>
        `;
      }

      return `
        <section class="section" id="projects" aria-labelledby="projects-title" style="--delay: 420ms;">
          ${sectionHeader({
            kicker: "Projects",
            title: "Built to learn",
            description: "Personal projects that demonstrate backend technologies, architecture patterns, and engineering practice."
          })}

          <div class="project-list">
            ${projects
              .filter((project) => project?.name && project?.description)
              .map(
                (project) => `
                  <article class="project-card">
                    <div>
                      <h3>${escapeHtml(project.name)}</h3>
                      <p>${escapeHtml(project.description)}</p>
                    </div>
                    ${
                      project.link
                        ? makeButton({
                            href: project.link,
                            label: "View projects",
                            type: "secondary",
                            ariaLabel: `View ${project.name}`
                          })
                        : ""
                    }
                  </article>
                `
              )
              .join("")}
          </div>
        </section>
      `;
    };

    const renderSimpleList = ({ id, kicker, title, description, items, delay }) => {
      if (!hasItems(items)) return "";

      return `
        <section class="section" ${id ? `id="${escapeHtml(id)}"` : ""} style="--delay: ${delay ?? 480}ms;">
          ${sectionHeader({ kicker, title, description })}
          <ul class="simple-list">
            ${items.filter(Boolean).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </section>
      `;
    };

    const renderContact = (data) => {
      if (!data?.email && !data?.links) return "";

      return `
        <section class="contact-panel" id="contact" aria-labelledby="contact-title" style="--delay: 600ms;">
          <span class="section-kicker">Contact</span>
          <h2 class="contact-title" id="contact-title">Let’s build reliable backend systems.</h2>
          <p class="contact-text">
            Available for backend engineering opportunities, freelance systems work, and product-focused engineering teams.
          </p>

          <div class="contact-actions" aria-label="Contact actions">
            ${makeButton({
              href: `mailto:${data.email}`,
              label: "em.ehabm@gmail.com",
              type: "primary",
              ariaLabel: `Email ${data.name}`
            })}
            ${makeButton({
              href: data.phone ? `tel:${data.phone}` : "",
              label: data.phone,
              type: "secondary",
              ariaLabel: `Call ${data.name}`
            })}
            ${makeButton({
              href: data.links?.github,
              label: "GitHub",
              type: "secondary"
            })}
            ${makeButton({
              href: data.links?.linkedin,
              label: "LinkedIn",
              type: "secondary"
            })}
          </div>
        </section>
      `;
    };

    const renderFooter = (data) => {
      return `
        <footer class="footer">
          <p>
            © ${new Date().getFullYear()} ${escapeHtml(data.name)}.
            Built as a one-column backend portfolio inspired by modern product design.
          </p>
        </footer>
      `;
    };

    const renderApp = (data) => {
      app.innerHTML = `
        <div class="page-shell">
          ${renderNavigation(data)}
          <main id="main">
            ${renderHero(data)}
            ${renderStats(data.stats)}
            ${renderSummary(data)}
            ${renderExperience(data.experience)}
            ${renderSkills(data.skills)}
            ${renderEducation(data.education)}
            ${renderProjects(data.projects, data.links)}
            ${renderSimpleList({
              kicker: "Soft skills",
              title: "How I work",
              description: "Practical collaboration skills that support engineering delivery.",
              items: data.softSkills,
              delay: 480
            })}
            ${renderSimpleList({
              kicker: "Languages",
              title: "Communication",
              description: "Languages used for daily work, collaboration, and documentation.",
              items: data.languages,
              delay: 540
            })}
            ${renderContact(data)}
          </main>
          ${renderFooter(data)}
        </div>
      `;
    };

    renderApp(portfolioData);
  </script>
</body>
</html>
