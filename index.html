    :root {
      /* Wise-inspired colors provided earlier */
      --primary: #9FE870;
      --background: #163300;
      --content: #E8EBE6;

      --text: rgba(232, 235, 230, 0.92);
      --muted: rgba(232, 235, 230, 0.62);
      --muted-soft: rgba(232, 235, 230, 0.45);

      --surface: rgba(232, 235, 230, 0.055);
      --surface-hover: rgba(232, 235, 230, 0.085);
      --surface-active: rgba(159, 232, 112, 0.16);

      --border: rgba(232, 235, 230, 0.13);
      --border-primary: rgba(159, 232, 112, 0.34);

      --font-display: "League Spartan", "Arial Black", Impact, sans-serif;
      --font-body: "Inter 18pt", Inter, Arial, sans-serif;
      --font-title: "Inter 24pt", Inter, Arial, sans-serif;
      --font-screen: "Inter 28pt", Inter, Arial, sans-serif;

      --container: 580px;
      --radius: 7px;
      --radius-sm: 5px;
      --radius-pill: 6px;
      --ease: 170ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.65;
      letter-spacing: -0.005em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 0%, rgba(159, 232, 112, 0.09), transparent 310px),
        radial-gradient(circle at 50% 100%, rgba(232, 235, 230, 0.045), transparent 380px);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    ::selection {
      color: var(--background);
      background: var(--primary);
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .shell {
      width: min(100% - 32px, var(--container));
      margin-inline: auto;
      padding: 26px 0 48px;
    }

    .profile {
      display: grid;
      grid-template-columns: 62px 1fr;
      align-items: center;
      gap: 15px;
      margin-bottom: 26px;
    }

    .avatar {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--background);
      background: var(--primary);
      font-family: var(--font-display);
      font-size: 25px;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      box-shadow: 0 0 0 5px rgba(232, 235, 230, 0.05);
    }

    .name-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 3px;
    }

    .name {
      margin: 0;
      color: var(--content);
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .aka {
      color: rgba(159, 232, 112, 0.68);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.015em;
    }

    .role {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.005em;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 0 0 44px;
    }

    .nav button {
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 9px 15px;
      background: transparent;
      color: var(--content);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.0125em;
      cursor: pointer;
      transition: background var(--ease), border-color var(--ease), color var(--ease);
    }

    .nav button:hover {
      background: var(--surface);
      border-color: var(--border);
    }

    .nav button.active {
      background: var(--surface-active);
      border-color: var(--border-primary);
      color: var(--primary);
    }

    .view {
      display: none;
      animation: fade 220ms ease both;
    }

    .view.active {
      display: block;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro {
      display: grid;
      gap: 17px;
      margin-bottom: 28px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: -0.005em;
    }

    .intro strong {
      color: var(--content);
      font-weight: 600;
    }

    .inline-link {
      color: var(--primary);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .note {
      margin: 0 0 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--content);
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }

    .small-note {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.65;
      letter-spacing: 0.01em;
    }

    .section-title {
      margin: 0 0 20px;
      color: var(--content);
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .section-lead {
      margin: -6px 0 32px;
      max-width: 500px;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.65;
      letter-spacing: -0.005em;
    }

    .cards {
      display: grid;
      gap: 14px;
    }

    .card {
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      transition: background var(--ease), border-color var(--ease), transform var(--ease);
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: var(--border-primary);
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      margin: 0;
      color: var(--content);
      font-family: var(--font-title);
      font-size: 19px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.015em;
    }

    .card-meta {
      margin: 2px 0 0;
      color: var(--muted-soft);
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: 0.01em;
    }

    .period {
      color: var(--muted-soft);
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.55;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.75;
      letter-spacing: 0.01em;
    }

    .bullets {
      display: grid;
      gap: 8px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .bullets li {
      position: relative;
      padding-left: 18px;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .bullets li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.74em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0.95;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid rgba(159, 232, 112, 0.27);
      border-radius: var(--radius-pill);
      padding: 3px 9px;
      color: var(--muted);
      background: rgba(159, 232, 112, 0.055);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      min-width: 92px;
      border-radius: 7px;
      background: rgba(232, 235, 230, 0.065);
      border: 1px solid rgba(232, 235, 230, 0.07);
      padding: 8px 10px;
      text-align: center;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-family: var(--font-display);
      font-size: 25px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .project-link {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .project-link a {
      color: var(--primary);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .simple-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .simple-list a,
    .simple-list li {
      display: block;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid transparent;
      padding: 10px 13px;
      color: var(--content);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.45;
      transition: background var(--ease), border-color var(--ease);
    }

    .simple-list a:hover {
      border-color: var(--border-primary);
      background: var(--surface-hover);
    }

    .contact {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .contact-links a {
      color: var(--content);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
      transition: color var(--ease);
    }

    .contact-links a:hover {
      color: var(--primary);
    }

    .footer {
      margin-top: 36px;
      color: rgba(232, 235, 230, 0.38);
      text-align: center;
      font-family: var(--font-body);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 24px, var(--container));
        padding-top: 20px;
      }

      .profile {
        grid-template-columns: 54px 1fr;
        gap: 12px;
      }

      .avatar {
        width: 54px;
        height: 54px;
        font-size: 22px;
      }

      .name {
        font-size: 29px;
      }

      .role {
        font-size: 13px;
      }

      .nav {
        gap: 7px;
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 34px;
      }

      .nav button {
        flex: 0 0 auto;
        padding: 8px 12px;
      }

      .section-title {
        font-size: 35px;
      }

      .card-top {
        display: grid;
        gap: 4px;
      }

      .period {
        white-space: normal;
      }

      .stats {
        justify-content: flex-start;
      }

      .stat {
        min-width: 82px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

    const safe = (value) =>

              ${data.intro.map((text) => `<p>${safe(text)}</p>`).join("")}
            </div>
          ` : ""}

          ${hasItems(data.stats) ? `
            <div class="card" aria-label="Quick stats">
              <div class="stats">
                ${data.stats.map((stat) => `
                  <div class="stat">
                    <span>${safe(stat.label)}</span>
                    <strong>${safe(stat.value)}</strong>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}

          ${data.highlight ? `<p class="note">${safe(data.highlight)}</p>` : ""}

          <p class="small-note">
            Reach me at
            <a class="inline-link" href="mailto:${safe(data.email)}">${safe(data.email)}</a>
            ${data.location ? ` · ${safe(data.location)}` : ""}
          </p>

          ${renderContactLinks(data)}
        </section>
      `;
    }

    function renderProjects(projects) {
      if (!hasItems(projects)) return "";

      return `
        <section class="view" id="projects-view">
          <h2 class="section-title">Projects Board</h2>
          <p class="section-lead">
            Projects and product work that show backend delivery, SaaS experience, real users, and system thinking.
          </p>

          <div class="cards">
            ${projects.map((project) => `
              <article class="card">
                <div class="card-top">
                  <div>
                    <h3 class="card-title">${safe(project.name)}</h3>
                  </div>
                </div>

                ${project.description ? `<p class="description">${safe(project.description)}</p>` : ""}

                ${hasItems(project.stats) ? `
                  <div class="stats">
                    ${project.stats.map((stat) => `
                      <div class="stat">
                        <span>${safe(stat.label)}</span>
                        <strong>${safe(stat.value)}</strong>
                      </div>
                    `).join("")}
                  </div>
                ` : ""}

                ${project.link ? `
                  <div class="project-link">
                    ${externalLink(project.link, "↗ Link")}
                  </div>
                ` : ""}
              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderSkills(skills, softSkills, languages) {
      const skillGroups = hasItems(skills)
        ? skills.filter((group) => group.group && hasItems(group.items))
        : [];

      return `
        <section class="view" id="skills-view">
          <h2 class="section-title">Skills</h2>
          <p class="section-lead">
            Technologies, backend patterns, and practices I use or study for professional software engineering.
          </p>

          ${skillGroups.length ? `
            <div class="cards">
              ${skillGroups.map((group) => `
                <article class="card">
                  <h3 class="card-title">${safe(group.group)}</h3>
                  <div class="chips">
                    ${group.items.map((item) => `<span class="chip">${safe(item)}</span>`).join("")}
                  </div>
                </article>
              `).join("")}
            </div>
          ` : ""}

          ${hasItems(softSkills) ? `
            <h2 class="section-title" style="margin-top: 32px;">How I Work</h2>
            <ul class="simple-list">
              ${softSkills.map((item) => `<li>${safe(item)}</li>`).join("")}
            </ul>
          ` : ""}

          ${hasItems(languages) ? `
            <h2 class="section-title" style="margin-top: 32px;">Languages</h2>
            <ul class="simple-list">
              ${languages.map((item) => `<li>${safe(item)}</li>`).join("")}
            </ul>
          ` : ""}
        </section>
      `;
    }

    function renderWork(experience, education) {
      return `
        <section class="view" id="work-view">
          <h2 class="section-title">Employment History</h2>
          <p class="section-lead">
            Backend and full-stack work on products, APIs, integrations, real-time features, and production-facing systems.
          </p>

          ${hasItems(experience) ? `
            <div class="cards">
              ${experience.map((job) => `
                <article class="card">
                  <div class="card-top">
                    <div>
                      <p class="card-meta">
                        ${[job.place, job.type].filter(Boolean).map(safe).join(" · ")}
                      </p>
                      <h3 class="card-title">${safe(job.title)} at ${safe(job.company)}</h3>
                    </div>
                    ${job.period ? `<span class="period">${safe(job.period)}</span>` : ""}
                  </div>

                  ${job.description ? `<p class="description">${safe(job.description)}</p>` : ""}

                  ${hasItems(job.bullets) ? `
                    <ul class="bullets">
                      ${job.bullets.map((bullet) => `<li>${safe(bullet)}</li>`).join("")}
                    </ul>
                  ` : ""}

                  ${hasItems(job.tags) ? `
                    <div class="chips">
                      ${job.tags.map((tag) => `<span class="chip">${safe(tag)}</span>`).join("")}
                    </div>
                  ` : ""}
                </article>
              `).join("")}
            </div>
          ` : ""}

          ${hasItems(education) ? `
            <h2 class="section-title" style="margin-top: 32px;">Education</h2>
            <ul class="simple-list">
              ${education.map((item) => `
                <li>
                  <strong>${safe(item.title)}</strong><br>
                  <span style="color: var(--muted);">${safe(item.subtitle)}</span>
                </li>
              `).join("")}
            </ul>
          ` : ""}
        </section>
      `;
    }

    function renderContactLinks(data) {
      const items = [
        data.links?.github ? externalLink(data.links.github, "GitHub") : "",
        data.links?.linkedin ? externalLink(data.links.linkedin, "LinkedIn") : "",
        data.links?.portfolio ? externalLink(data.links.portfolio, "Portfolio") : "",
        data.phone ? externalLink(`tel:${data.phone}`, "Phone") : ""
      ].filter(Boolean);

      if (!items.length) return "";

      return `
        <div class="contact">
          <div class="contact-links" aria-label="Contact and social links">
            ${items.join("")}
          </div>
        </div>
      `;
    }

    function renderFooter(data) {
      return `
        <footer class="footer">
          © ${new Date().getFullYear()} ${safe(data.name)} — backend portfolio.
        </footer>
      `;
    }

    function bindNavigation() {
      const buttons = document.querySelectorAll(".nav button");
      const views = document.querySelectorAll(".view");

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const viewName = button.dataset.view;

          buttons.forEach((item) => item.classList.remove("active"));
          views.forEach((view) => view.classList.remove("active"));

          button.classList.add("active");
          document.querySelector(`#${viewName}-view`)?.classList.add("active");
        });
      });
    }

    function renderApp(data) {
      app.innerHTML = `
        <main class="shell">
          ${renderHeader(data)}
          ${renderHome(data)}
          ${renderProjects(data.projects)}
          ${renderSkills(data.skills, data.softSkills, data.languages)}
          ${renderWork(data.experience, data.education)}
          ${renderFooter(data)}
        </main>
      `;

      bindNavigation();
    }

    renderApp(portfolioData);
  </script>
</body>
</html>
